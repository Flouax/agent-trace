<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>轨迹与余额 · 设置</title>
<link rel="stylesheet" href="/panel/balance.css" />
<style>
  /* 设置页不加载 panel/tokens.css：与余额页签同一套变量值在这里和 balance.css 里各给一份回退 */
  body {
    margin: 0; padding: 16px 4px; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--at-ink, var(--text-primary, #1a1a1a));
  }
  .intro { margin: 0 12px 8px; max-width: 40em; color: var(--at-ink-2, var(--text-secondary, #666)); font-size: 12px; }
  .intro p { margin: 0 0 8px; }
  .intro strong { color: var(--at-ink, var(--text-primary, #1a1a1a)); font-weight: 500; }
  #balance-root { position: relative; }
</style>
</head>
<body>
  <div class="intro">
    <p><strong>余额</strong>：右侧栏「轨迹与余额」的「余额」页签用来查询各供应商的剩余额度。粘贴 CC Switch 的用量查询脚本即可，也可以用内置的「通用 / New API / Sub2API」预设。</p>
    <p><strong>密钥保存在哪里</strong>：你填的供应商密钥只写入 Cindy 的系统保险库，插件代码、界面和日志都读不回，界面只显示尾 4 位。查询时由 Cindy 在请求里自动带上，并且只发给你添加过的那个域名。</p>
    <p>下面是同一份供应商管理界面，在这里添加、编辑、删除与在右侧栏里效果一致。</p>
  </div>
  <div id="balance-root"></div>
  <!-- CSP 不放行内联脚本：脚本必须是外挂文件 -->
  <script src="/panel/bridge.js"></script>
  <script src="/panel/balance.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
